<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000"><rect width="720" height="1000" fill="#fbf6ed"/><rect x="25" y="25" width="670" height="950" fill="none" stroke="#58212d" stroke-width=".7"/><g fill="#58212d" font-family="Georgia,serif"><text x="360" y="110" font-size="53" letter-spacing="7" text-anchor="middle">chevalet</text><text x="360" y="148" font-size="11" letter-spacing="4" text-anchor="middle">BAR &amp; BISTROT</text><path d="M315 194H405M360 184V204" stroke="#58212d" stroke-width=".7"/><text x="360" y="265" text-anchor="middle" font-style="italic" font-size="42">Закуски</text><text x="70" y="350" font-size="24">Тартар из говядины</text><text x="70" y="378" font-size="13" fill="#766b61">Каперсы, корнишоны, горчичный соус</text><text x="650" y="350" text-anchor="end" font-family="Arial" font-size="18">890</text><text x="70" y="450" font-size="24">Паштет из утиной печени</text><text x="70" y="478" font-size="13" fill="#766b61">Бриошь, сезонный конфитюр</text><text x="650" y="450" text-anchor="end" font-family="Arial" font-size="18">650</text><text x="70" y="550" font-size="24">Буррата с томатами</text><text x="70" y="578" font-size="13" fill="#766b61">Базилик, оливковое масло</text><text x="650" y="550" text-anchor="end" font-family="Arial" font-size="18">790</text><text x="70" y="650" font-size="24">Зелёный салат</text><text x="70" y="678" font-size="13" fill="#766b61">Листья салата, авокадо, цитрусовая заправка</text><text x="650" y="650" text-anchor="end" font-family="Arial" font-size="18">590</text><text x="70" y="750" font-size="24">Луковый суп</text><text x="70" y="778" font-size="13" fill="#766b61">Грюйер, домашний хлеб</text><text x="650" y="750" text-anchor="end" font-family="Arial" font-size="18">690</text><path d="M70 864H650" stroke="#58212d" stroke-width=".5"/><text x="360" y="901" text-anchor="middle" font-size="13" font-style="italic">В удовольствие. С любовью.</text><text x="360" y="934" text-anchor="middle" font-family="Arial" font-size="9" fill="#766b61">ДЕМОНСТРАЦИОННАЯ КАРТА · БЛЮДА И ЦЕНЫ ДЛЯ ПРЕЗЕНТАЦИИ · ₽</text><text x="650" y="958" text-anchor="end" font-size="11">01</text></g></svg>